    <div class="brand"><span class="logo"><svg class="ic"><use href="#i-logo"/></svg></span>Halte</div>
    <button class="fab" aria-label="Réglages"><svg class="ic"><use href="#i-settings"/></svg></button>
  </div>
  <div class="sheet" style="top:300px">
    <div class="handle"></div>
    <div class="lhead"><div><h2 class="t-h">Autour de vous</h2><p class="t-sub">16 lieux · 2 écoutés</p></div></div>
    <div class="chips">

      <li class="place"><span class="tile" data-cat="histoire"><svg class="ic"><use href="#i-histoire"/></svg></span>
        <span class="ptxt"><b>Couvent des Jacobins</b><span><em>310 m</em> · Chef-d'œuvre du gothique méridional</span></span>

        <button class="playsm" aria-label="Réécouter"><svg class="ic f"><use href="#i-play"/></svg></button></li>

<!-- 3. Fiche lieu -->
<figure><div class="phone" id="s-fiche">
  <div class="map" data-sel="taur"><div class="map-bg"></div><div class="fade"></div></div>
  <div class="status"><span>9:41</span><span class="bat"></span></div>
  <div class="topbar">
    <div class="brand"><span class="logo"><svg class="ic"><use href="#i-logo"/></svg></span>Halte</div>
    <button class="fab" aria-label="Réglages"><svg class="ic"><use href="#i-settings"/></svg></button>
  </div>
  <div class="sheet">
    <div class="handle"></div>
    <button class="fclose" aria-label="Fermer la fiche"><svg class="ic"><use href="#i-close"/></svg></button>
    <div class="cats"><span class="cat" data-cat="anecdote"><svg class="ic"><use href="#i-anecdote"/></svg>Anecdote</span><span class="cat" data-cat="histoire"><svg class="ic"><use href="#i-histoire"/></svg>Histoire</span></div>
    <h2 class="t-title">Notre-Dame du Taur</h2>

      <button class="btn sec stack">Version longue<span class="dur">1 min 10</span></button>
      <button class="btn sec"><svg class="ic"><use href="#i-route"/></svg>Itinéraire</button>
    </div>
    <button class="srcrow"><svg class="ic"><use href="#i-book"/></svg><span>Sources (4)</span><svg class="ic"><use href="#i-right"/></svg></button>
  </div>

</div><figcaption>3 · Fiche lieu (pastille touchée)</figcaption></figure>

<!-- 4. Lecteur plein écran -->
<figure><div class="phone" id="s-lecteur">
  <div class="status"><span>9:41</span><span class="bat"></span></div>
  <div class="pf-top">
    <button class="rb" aria-label="Réduire le lecteur"><svg class="ic"><use href="#i-down"/></svg></button>
    <span class="pf-mode">Version longue</span>
    <button class="rb" aria-label="Arrêter"><svg class="ic"><use href="#i-close"/></svg></button>
  </div>
  <div class="pf-head">
    <span class="tile" data-cat="histoire"><svg class="ic"><use href="#i-histoire"/></svg></span>
    <div><h2 class="t-title">Le Capitole</h2><p class="t-tag" style="margin-top:2px">Histoire · Culture · 40 m</p></div>
  </div>
  <div class="pf-text">
    <p>Vous êtes devant le Capitole, siège du pouvoir municipal depuis plus de huit cents ans. <mark>Son histoire commence en 1190, quand les consuls de Toulouse cherchent un bâtiment pour héberger la maison commune.</mark></p>
    <p class="fut">Le nom a une double histoire. En occitan, le chapitre, l'assemblée des magistrats qui dirigeaient la ville, se dit « capítol » : ces magistrats sont les capitouls. Et en 1522, le greffier Pierre Salmon baptise le lieu Capitole, pour rappeler le Capitole de la Rome antique.</p>
    <p class="fut">Les siècles ont laissé leurs couches. La tour des archives, le donjon, est construite en 1525 pour protéger les archives et abriter le conseil des capitouls.</p>
  </div>
  <div class="pf-ctrl">
    <div class="pbar"><i></i><b></b></div>
    <div class="ptimes"><span>0:42</span><span>−0:58</span></div>
    <div class="transport">
      <button class="tb" aria-label="Phrase précédente"><svg class="ic"><use href="#i-back"/></svg></button>
      <button class="tplay" aria-label="Pause"><svg class="ic f"><use href="#i-pause"/></svg></button>
      <button class="tb" aria-label="Phrase suivante"><svg class="ic"><use href="#i-fwd"/></svg></button>
    </div>
    <div class="subrow">
      <button>Vitesse 1×</button>
      <button><svg class="ic"><use href="#i-book"/></svg>Sources (5)</button>
    </div>
  </div>
  <div class="homebar"></div>
</div><figcaption>4 · Lecteur plein écran</figcaption></figure>

</main>

<script>
(function () {
  var d = (location.search.match(/d=(\w+)/) || [])[1] || 'signal';
  document.body.className = 'd-' + d;
  [].forEach.call(document.querySelectorAll('#switch a'), function (a) { a.classList.toggle('on', a.getAttribute('href') === '?d=' + d); });
  // Carte fixe : tuiles OSM zoom 16 assemblées (img/carte-toulouse.png), coin haut-gauche en coordonnées monde.
  var Z = 16, LEFT = 8455684.636, TOP = 6125681.802, T = 256 * Math.pow(2, Z);
  function px(lat, lon) {
    var s = Math.sin(lat * Math.PI / 180);
    return { x: (lon + 180) / 360 * T - LEFT, y: (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * T - TOP };
  }
  var ME = { lat: 43.6047, lon: 1.4436 };
  var P = [
    ['capitole', 'histoire', 43.6045, 1.444], ['taur', 'anecdote', 43.6061, 1.4427], ['jacobins', 'histoire', 43.6035, 1.4402],
    ['saint-sernin', 'histoire', 43.6084, 1.442, 1], ['augustins', 'culture', 43.601, 1.446], ['assezat', 'culture', 43.6004, 1.442],
    ['daurade', 'histoire', 43.6008, 1.4397, 1], ['pont-neuf', 'histoire', 43.5993, 1.4387], ['bazacle', 'anecdote', 43.6055, 1.434]
  ];
  [].forEach.call(document.querySelectorAll('.map'), function (m) {
    var sel = m.getAttribute('data-sel');
    P.forEach(function (p) {
      var q = px(p[2], p[3]);
      if (q.x < -30 || q.x > 420 || q.y < -30 || q.y > 870) return;
      var e = document.createElement('span');
      e.className = 'pin' + (p[4] ? ' done' : '') + (p[0] === sel ? ' sel' : '');
      e.setAttribute('data-cat', p[1]);
      e.style.left = q.x.toFixed(1) + 'px'; e.style.top = q.y.toFixed(1) + 'px';
      e.innerHTML = '<svg class="ic"><use href="#i-' + p[1] + '"/></svg>';
      m.appendChild(e);
    });
    var u = px(ME.lat, ME.lon), me = document.createElement('span');
    me.className = 'me'; me.style.left = u.x + 'px'; me.style.top = u.y + 'px';
    m.appendChild(me);
  });
})();
</script>
